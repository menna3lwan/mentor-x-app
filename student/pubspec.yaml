dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  # Testing
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.5.0
  bloc_test: ^10.0.0
  bloc_presentation_test: ^1.2.0
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

  # Code generation:
  go_router_builder: ^4.2.0
  build_runner: ^2.12.2

  # For native splash screen and app icon
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/

  #   - family: HT-Mosafer-Rounded-English
  #     fonts:
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Regular.otf
  #         weight: 400
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Bold.otf
  #         weight: 700

  # Install the package globally: dart pub global activate flutter_gen
  # Run with: dart run build_runner build
flutter_gen:
  output: lib/core/constants/gen/
  line_length: 80
  fonts:
    enabled: false
  colors:
    enabled: false
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
      package_parameter_enabled: true

patrol:
  app_name: MentorX Student
  test_directory: integration_test
  android:
    package_name: com.mentorx.student
  ios:
    bundle_id: com.mentorx.student

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: mentorx-e9
