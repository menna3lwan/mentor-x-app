name: mentorx_student
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+4
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.5.0

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.2

  # For Localization
  flutter_localizations:
    sdk: flutter
  slang: ^4.13.0
  slang_flutter: ^4.13.0

  # Caching
  cached_network_image: ^3.4.1

  # Vector Grahpics
  vector_graphics: ^1.1.20

  # Navigation:
  go_router: ^17.1.0

  # Fonts
  google_fonts: ^8.0.2

  # For UI
  gap: ^3.0.1
  # For loading shimmers
  skeletonizer: ^2.1.3
  # For SMS OTP Auto filling
  pinput: ^6.0.2

  #Utils:
  intl: ^0.20.2
  equatable: ^2.0.8
  event_bus: ^2.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  # For SMS OTP Auto filling on Android
  smart_auth: ^3.2.0
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  percent_indicator: ^4.2.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

  # MentorX Packages:
  mentorx_core:
    path: ../packages/mentorx_core
  mentorx_ui:
    path: ../packages/mentorx_ui

  # Common Repositories
  flutter_secure_storage_cache_repository:
    path: ../packages/common/flutter_secure_storage_cache_repository

  # Mock Repositories
  mock_authentication_repository:
    path: ../packages/mock/student/mock_authentication_repository
  mock_home_repository:
    path: ../packages/mock/student/mock_home_repository
  mock_course_repository:
    path: ../packages/mock/student/mock_course_repository
  mock_attendance_repository:
    path: ../packages/mock/student/mock_attendance_repository
  mock_wallet_repository:
    path: ../packages/mock/student/mock_wallet_repository
  mock_notification_repository:
    path: ../packages/mock/student/mock_notification_repository
  mock_settings_repository:
    path: ../packages/mock/student/mock_settings_repository
  mock_profile_repository:
    path: ../packages/mock/student/mock_profile_repository
  mock_quiz_repository:
    path: ../packages/mock/student/mock_quiz_repository
  mock_assignment_repository:
    path: ../packages/mock/student/mock_assignment_repository
  mock_ai_repository:
    path: ../packages/mock/student/mock_ai_repository
  mock_marketplace_repository:
    path: ../packages/mock/student/mock_marketplace_repository
  mock_announcement_repository:
    path: ../packages/mock/student/mock_announcement_repository
  mock_rewards_repository:
    path: ../packages/mock/student/mock_rewards_repository
  mock_grade_repository:
    path: ../packages/mock/student/mock_grade_repository
  mock_student_registration_repository:
    path: ../packages/mock/student/mock_student_registration_repository

  # Clients
  dio_http_client:
    path: ../packages/clients/dio_http_client

  # Dio Repositories
  dio_authentication_repository:
    path: ../packages/student/dio_authentication_repository
  dio_home_repository:
    path: ../packages/student/dio_home_repository
  dio_course_repository:
    path: ../packages/student/dio_course_repository
  dio_quiz_repository:
    path: ../packages/student/dio_quiz_repository
  dio_assignment_repository:
    path: ../packages/student/dio_assignment_repository
  dio_profile_repository:
    path: ../packages/student/dio_profile_repository
  dio_marketplace_repository:
    path: ../packages/student/dio_marketplace_repository
  dio_ai_repository:
    path: ../packages/student/dio_ai_repository
  dio_rewards_repository:
    path: ../packages/student/dio_rewards_repository
  dio_wallet_repository:
    path: ../packages/student/dio_wallet_repository
  dio_notification_repository:
    path: ../packages/student/dio_notification_repository
  dio_announcement_repository:
    path: ../packages/student/dio_announcement_repository
  dio_attendance_repository:
    path: ../packages/student/dio_attendance_repository
  dio_grade_repository:
    path: ../packages/student/dio_grade_repository
  dio_settings_repository:
    path: ../packages/student/dio_settings_repository
  dio_student_registration_repository:
    path: ../packages/student/dio_student_registration_repository

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  bloc_presentation_test: ^1.2.0

  # Linting
  flutter_lints: ^6.0.0

  # Code generation:
  go_router_builder: ^4.2.0
  build_runner: ^2.12.2

  # For native splash screen and app icon
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # assets:
  #   - path: ../packages/mentorx_ui/lib/assets/svgs/
  #     transformers:
  #       - package: vector_graphics_compiler

  #   - family: HT-Mosafer-Rounded-English
  #     fonts:
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Regular.otf
  #         weight: 400
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Bold.otf
  #         weight: 700

# Install the package globally: dart pub global activate flutter_gen
# Run with: dart run build_runner build
flutter_gen:
  output: lib/core/constants/gen/
  line_length: 80
  fonts:
    enabled: false
  colors:
    enabled: false
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
      package_parameter_enabled: true
