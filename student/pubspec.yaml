name: mentorx_student
description: "A new Flutter project."
publish_to: "none"
version: 0.0.0
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.1

  # For Localization
  flutter_localizations:
    sdk: flutter
  slang: ^4.9.2
  slang_flutter: ^4.9.0

  # Caching
  cached_network_image: ^3.4.1

  # Vector Grahpics
  vector_graphics: ^1.1.19

  # Navigation:
  go_router: ^16.3.0

  # Fonts
  google_fonts: ^6.2.1

  # For UI
  gap: ^3.0.1
  # For loading shimmers
  skeletonizer: ^2.1.0+1
  # For SMS OTP Auto filling
  pinput: ^5.0.2

  #Utils:
  intl: ^0.20.2
  equatable: ^2.0.7
  event_bus: ^2.0.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  permission_handler: ^12.0.1
  # For SMS OTP Auto filling on Android
  smart_auth: ^3.2.0
  image_picker: ^1.2.0
  share_plus: ^12.0.1

  # Core
  student_core:
    path: packages/student_core

  # MentorX Packages:
  mentorx_core:
    path: ../packages/mentorx_core
  mentorx_ui:
    path: ../packages/mentorx_ui

  # Common Repositories
  flutter_secure_storage_cache_repository:
    path: ../packages/common/flutter_secure_storage_cache_repository

  # Mock Repositories
  mock_authentication_repository:
    path: packages/mock/mock_authentication_repository
  mock_home_repository:
    path: packages/mock/mock_home_repository

  # Clients
  dio_http_client:
    path: ../packages/clients/dio_http_client

  # Dio Repositories
  dio_authentication_repository:
    path: packages/student/dio_authentication_repository
  dio_home_repository:
    path: packages/student/dio_home_repository

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  bloc_presentation_test: ^1.2.0

  # Linting
  flutter_lints: ^6.0.0

  # Code generation:
  go_router_builder: ^4.1.1
  build_runner: ^2.10.1

  # For native splash screen and app icon
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # assets:
  #   - path: ../packages/mentorx_ui/lib/assets/svgs/
  #     transformers:
  #       - package: vector_graphics_compiler

  #   - family: HT-Mosafer-Rounded-English
  #     fonts:
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Regular.otf
  #         weight: 400
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Bold.otf
  #         weight: 700

# Install the package globally: dart pub global activate flutter_gen
# Run with: dart run build_runner build
flutter_gen:
  output: lib/core/constants/gen/
  line_length: 80
  fonts:
    enabled: false
  colors:
    enabled: false
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
      package_parameter_enabled: true
