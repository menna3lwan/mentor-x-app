name: mentorx_monorepo
publish_to: none
environment:
  sdk: ^3.9.2

workspace:
  # Apps
  - student
  - parent

  # Domain core
  - packages/mentorx_core
  # UI kit
  - packages/mentorx_ui

  # Clients
  - packages/clients/dio_http_client

  # Common
  - packages/common/flutter_secure_storage_cache_repository

  # Mock data
  - packages/mock_data

  # Dio repositories
  - student/packages/student/dio_authentication_repository
  - student/packages/student/dio_home_repository

  # Student core
  - student/packages/student_core

  # Mock repositories
  - student/packages/mock/mock_authentication_repository
  - student/packages/mock/mock_home_repository
  - student/packages/mock/mock_course_repository

  # Parent core
  - parent/packages/parent_core

  # Parent Dio repositories
  - parent/packages/parent/dio_authentication_repository

  # Parent Mock repositories
  - parent/packages/mock/mock_authentication_repository

dependency_overrides:
  test_api: ^0.7.7

dev_dependencies:
  melos: ^7.1.0
