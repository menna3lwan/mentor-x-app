name: mentorx_monorepo
publish_to: none
environment:
  sdk: ^3.11.4

workspace:
  # Apps
  - student
  - parent

  # Domain core
  - packages/mentorx_core
  # UI kit
  - packages/mentorx_ui

  # Clients
  - packages/clients/dio_http_client

  # Common
  - packages/common/flutter_secure_storage_cache_repository

  # Mock data
  - packages/mock_data

  # Dio repositories
  - packages/student/dio_authentication_repository
  - packages/student/dio_home_repository
  - packages/student/dio_course_repository
  - packages/student/dio_quiz_repository
  - packages/student/dio_assignment_repository
  - packages/student/dio_profile_repository
  - packages/student/dio_marketplace_repository
  - packages/student/dio_ai_repository
  - packages/student/dio_rewards_repository
  - packages/student/dio_wallet_repository
  - packages/student/dio_notification_repository
  - packages/student/dio_announcement_repository
  - packages/student/dio_attendance_repository
  - packages/student/dio_grade_repository
  - packages/student/dio_settings_repository
  - packages/student/dio_student_registration_repository

  # Mock repositories
  - packages/mock/student/mock_authentication_repository
  - packages/mock/student/mock_home_repository
  - packages/mock/student/mock_course_repository
  - packages/mock/student/mock_attendance_repository
  - packages/mock/student/mock_wallet_repository
  - packages/mock/student/mock_notification_repository
  - packages/mock/student/mock_settings_repository
  - packages/mock/student/mock_profile_repository
  - packages/mock/student/mock_quiz_repository
  - packages/mock/student/mock_assignment_repository
  - packages/mock/student/mock_ai_repository
  - packages/mock/student/mock_marketplace_repository
  - packages/mock/student/mock_rewards_repository
  - packages/mock/student/mock_grade_repository
  - packages/mock/student/mock_announcement_repository
  - packages/mock/student/mock_student_registration_repository

  # Dio repositories
  - packages/parent/dio_authentication_repository
  - packages/parent/dio_home_repository

  # Parent Mock repositories
  - packages/mock/parent/mock_home_repository
  - packages/mock/parent/mock_authentication_repository

dependency_overrides:
  test_api: ^0.7.7

dev_dependencies:
  melos: ^7.1.0
