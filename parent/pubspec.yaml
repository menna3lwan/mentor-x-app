name: parent
description: MentorX Parent Application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # MentorX Packages:
  mentorx_core:
    path: ../packages/mentorx_core
  mentorx_ui:
    path: ../packages/mentorx_ui
  parent_dio_authentication_repository:
    path: ../packages/parent/dio_authentication_repository
  parent_dio_home_repository:
    path: ../packages/parent/dio_home_repository
  parent_dio_children_repository:
    path: ../packages/parent/dio_children_repository
  parent_dio_attendance_repository:
    path: ../packages/parent/dio_attendance_repository
  parent_dio_course_repository:
    path: ../packages/parent/dio_course_repository
  parent_dio_financial_repository:
    path: ../packages/parent/dio_financial_repository
  parent_dio_grade_repository:
    path: ../packages/parent/dio_grade_repository
  parent_dio_communication_repository:
    path: ../packages/parent/dio_communication_repository
  parent_mock_authentication_repository:
    path: ../packages/mock/parent/mock_authentication_repository
  parent_mock_home_repository:
    path: ../packages/mock/parent/mock_home_repository
  parent_mock_children_repository:
    path: ../packages/mock/parent/mock_children_repository
  parent_mock_financial_repository:
    path: ../packages/mock/parent/mock_financial_repository
  parent_mock_course_repository:
    path: ../packages/mock/parent/mock_course_repository
  parent_mock_attendance_repository:
    path: ../packages/mock/parent/mock_attendance_repository
  parent_mock_grade_repository:
    path: ../packages/mock/parent/mock_grade_repository
  parent_mock_communication_repository:
    path: ../packages/mock/parent/mock_communication_repository
  flutter_secure_storage_cache_repository:
    path: ../packages/common/flutter_secure_storage_cache_repository
  dio_http_client:
    path: ../packages/clients/dio_http_client

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.2
  event_bus: ^2.0.1

  # Routing
  go_router: ^17.1.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.2
  mix: ^1.7.0
  animate_do: ^5.1.0
  gap: ^3.0.1
  # Services
  device_info_service:
    path: ../packages/services/device_info_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.5.0
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  go_router_builder: ^4.2.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  bloc_presentation_test: ^1.2.0

flutter:
  uses-material-design: true
  generate: true

patrol:
  app_name: MentorX Parent
  test_directory: integration_test
  android:
    package_name: com.mentorx.parent
  ios:
    bundle_id: com.mentorx.parent
