name: parent
description: MentorX Parent Application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # MentorX Packages:
  mentorx_core:
    path: ../packages/mentorx_core
  mentorx_ui:
    path: ../packages/mentorx_ui
  parent_core:
    path: ../packages/parent_core
  parent_ui:
    path: ../packages/parent_ui
  parent_authentication_repository:
    path: ../packages/parent/dio_authentication_repository
  parent_dio_home_repository:
    path: ../packages/parent/dio_home_repository
  parent_mock_authentication_repository:
    path: ../packages/mock/parent/mock_authentication_repository
  parent_mock_home_repository:
    path: ../packages/mock/parent/mock_home_repository
  flutter_secure_storage_cache_repository:
    path: ../packages/common/flutter_secure_storage_cache_repository
  dio_http_client:
    path: ../packages/clients/dio_http_client

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.2
  event_bus: ^2.0.1

  # Routing
  go_router: ^17.1.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  go_router_builder: ^4.2.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  bloc_presentation_test: ^1.2.0

flutter:
  uses-material-design: true
  generate: true
