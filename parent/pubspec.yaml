name: parent
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.2

  # For Localization
  flutter_localizations:
    sdk: flutter
  slang: ^4.13.0
  slang_flutter: ^4.13.0

  # Caching
  cached_network_image: ^3.4.1

  # Vector Grahpics
  vector_graphics: ^1.1.20

  # Navigation:
  go_router: ^17.1.0

  # For UI
  gap: ^3.0.1
  # For loading shimmers
  skeletonizer: ^2.1.3
  # For SMS OTP Auto filling
  pinput: ^6.0.2
  country_flags: ^4.1.2

  #Utils:
  intl: ^0.20.2
  equatable: ^2.0.8
  event_bus: ^2.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  # For SMS OTP Auto filling on Android
  smart_auth: ^3.2.0
  image_picker: ^1.2.1
  share_plus: ^12.0.1

  # MentorX Packages:
  mentorx_core:
    path: ../packages/mentorx_core
  mentorx_ui:
    path: ../packages/mentorx_ui

  parent_core:
    path: packages/parent_core
  parent_ui:
    path: packages/parent_ui
  parent_authentication_repository:
    path: packages/parent/dio_authentication_repository
  parent_mock_authentication_repository:
    path: packages/mock/mock_authentication_repository
  flutter_secure_storage_cache_repository:
    path: ../packages/common/flutter_secure_storage_cache_repository

  # Common Repositories
  # flutter_secure_storage_cache_repository:
  #   path: ../packages/common/flutter_secure_storage_cache_repository

  # Mock Repositories

  # Clients
  dio_http_client:
    path: ../packages/clients/dio_http_client

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  bloc_presentation_test: ^1.2.0

  # Linting
  flutter_lints: ^6.0.0

  # Code generation:
  go_router_builder: ^4.2.0
  build_runner: ^2.12.2

  # For native splash screen and app icon
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # assets:
  #   - path: ../packages/mentorx_ui/lib/assets/svgs/
  #     transformers:
  #       - package: vector_graphics_compiler

  # fonts:
  #   - family: HT-Mosafer-Rounded
  #     fonts:
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded/HT-Mosafer-Rounded-Regular.otf
  #         weight: 400
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded/HT-Mosafer-Rounded-Bold.otf
  #         weight: 700

  #   - family: HT-Mosafer-Rounded-English
  #     fonts:
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Regular.otf
  #         weight: 400
  #       - asset: packages/mentorx_ui/assets/fonts/HT-Mosafer-Rounded-English/HT-Mosafer-Rounded-English-Bold.otf
  #         weight: 700

# Install the package globally: dart pub global activate flutter_gen
# Run with: dart run build_runner build
flutter_gen:
  output: lib/core/constants/gen/
  line_length: 80
  fonts:
    enabled: false
  colors:
    enabled: false
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
      package_parameter_enabled: true
