# Run with: dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  image_path_ios: "assets/launcher_icon/ios.png"
  image_path_ios_tinted_grayscale: "assets/launcher_icon/ios_single_color.png"

  image_path_android: "assets/launcher_icon/android.png"
  adaptive_icon_foreground: "assets/launcher_icon/android_12_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: "assets/launcher_icon/android_single_color.png"